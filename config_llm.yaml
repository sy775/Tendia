# Configuration de l'expérimentation multi-modèles (llm_router.py).
# Le pipeline de production n'utilise PAS ce fichier.
#
# Les modèles Gemini se choisissent dans .env (GEMINI_MODEL_CLASSIF,
# GEMINI_MODEL_ANALYSE) ; les valeurs ci-dessous ne servent que de repli.

modeles_par_defaut:
  CLAUDE_MODEL_CLASSIF: claude-haiku-4-5     # = tendia_classification (haiku)
  CLAUDE_MODEL_ANALYSE: claude-sonnet-4-6    # = llm_extract.MODELE
  GEMINI_MODEL_CLASSIF: gemini-3.1-flash-lite   # surchargeable dans .env
  GEMINI_MODEL_ANALYSE: gemini-4-argon          # surchargeable dans .env
  OPUS_MODEL: claude-opus-5-5

taux_usd_eur: 0.92   # même taux indicatif que tendia_classification / budget

# Tarifs en USD par million de tokens. Les tokens de sortie incluent les tokens
# de réflexion (« thinking ») pour Gemini, facturés au tarif de sortie.
# seuil_long_contexte : au-delà de N tokens d'entrée, tarif *_long appliqué.
tarifs_usd_par_million:
  claude-haiku-4-5:  {input: 1.0, output: 5.0}
  claude-sonnet-4-6: {input: 3.0, output: 15.0}
  # Opus 5.5 : 1M de contexte au tarif standard (pas de palier long contexte, cf. pricing Anthropic).
  claude-opus-5-5:   {input: 4.0, output: 20.0}
  # Gemini — https://ai.google.dev/gemini-api/docs/pricing (page du 2026-10-30), tier payant standard.
  # Sortie = réponse + tokens de réflexion.
  gemini-3.1-flash-lite: {input: 0.25, output: 1.50}
  gemini-3.5-flash-lite: {input: 0.30, output: 2.50}
  # ⚠ gemini-4-argon : tarif valable jusqu'au 30/11/2026, DOUBLE à partir du 01/12/2026 (4.00 / 20.00).
  gemini-4-argon: {input: 2.00, output: 10.00}
  gemini-3.1-pro-preview: {input: 2.00, output: 12.00, seuil_long_contexte: 200000,
                           input_long: 4.00, output_long: 18.00}

# Appels par minute maximum (intervalle minimal entre deux appels d'un même modèle).
rate_limits_rpm:
  defaut: 60

retries:
  max_tentatives: 5
  backoff_base_s: 2.0
  backoff_max_s: 90.0

taches:
  classif:
    timeout_s: 60
    max_tokens_claude: 800       # = tendia_classification.MAX_TOKENS_REPONSE
    max_tokens_gemini: 8192      # marge pour les tokens de réflexion
  analyse:
    timeout_s: 900
    max_tokens_claude: 64000     # (la prod Sonnet garde ses 32000 dans llm_extract)
    max_tokens_gemini: 32768     # réponse + réflexion — plafond API de gemini-4-argon (Models API)

# Coûts annexes du téléchargement DCE.
couts_dce:
  # Prix d'un captcha 2captcha (repli si le solde ne peut pas être lu). En USD.
  prix_captcha_usd: 0.001
  # Proxy résidentiel : seul le volume transféré est mesuré et affiché (pas de coût en euros).

# Gemini arrêté sur la limite de sortie (finish_reason MAX_TOKENS) : une relance avec un budget
# de réflexion réduit (repli : thinking_level LOW si le modèle refuse thinking_budget).
gemini_relance_max_tokens:
  thinking_budget: 16000

# Effort (profondeur de réflexion) des modèles Claude ; Opus 5.5 est à "medium" par défaut.
effort_claude:
  claude-opus-5-5: high

# Fenêtres de contexte vérifiées (entrée + sortie) — informatif.
#   claude-opus-5-5   : 1 000 000 in / 128 000 out (Models API), aucun palier long contexte
#   claude-sonnet-4-6 : 1 000 000 in / 128 000 out, aucun palier long contexte
#   claude-haiku-4-5  :   200 000 in /  64 000 out
#   gemini-4-argon    : 1 048 576 (entrée+sortie unifiées), sortie 65 536 par défaut ; tarif x2 au 01/12/2026
#   gemini-3.1-pro-preview : palier au-delà de 200 000 tokens d'entrée (4 $ / 18 $)

# Modes « global sans troncature » et « document ».
mode_document:
  max_tokens_entree_par_appel: 350000   # au-delà, une pièce est découpée par pages (aucune troncature)
  max_tokens_piece: 16000
  pieces_en_parallele: 4
  # Caractères par token, mesurés avec count_tokens sur des pièces de DCE réelles (BPU/CCTP denses) :
  # Opus 5.5 ≈ 2.1 (nouveau tokenizer), Sonnet 4.6 ≈ 2.5. Gemini : à calibrer (count_tokens) — 2.5 par prudence.
  chars_par_token:
    claude: 2.1
    gemini: 2.5
