{% extends "base.html" %}

{% block title %}{{ titre }} — Tendia{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-14 py-32">
  <div class="text-center">
    <div class="apt-eyebrow mb-5">À venir</div>
    <h1 class="apt-display apt-fs-56 apt-lh-102 mb-5" style="color: var(--apt-ink);">
      {{ titre }}
    </h1>
    <p class="apt-prose mb-10" style="color: var(--apt-ink-3);">{{ message }}</p>
    <div class="apt-divider mb-10"></div>
    <a href="/" class="apt-meta inline-flex items-center gap-1.5" style="color: var(--apt-ink-3);">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      Retour au dashboard
    </a>
  </div>
</div>
{% endblock %}
